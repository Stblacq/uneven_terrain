move_base_flex:
  ros__parameters:
    global_frame: 'map'
    robot_frame: 'base_footprint'
    odom_topic: 'odom'

    use_sim_time: true
    force_stop_at_goal: true
    force_stop_on_cancel: true
    
    # Data collection parameters
    enable_data_collection: false
    # Optional: specify custom filepath (leave empty for default ~/robot_dataset.csv)
    data_collection_filepath: ""

    # Wavefront update method: "standard", "with_s", or "fmm"
    # - standard: Default CVP method (balanced)
    # - with_s: Update with S parameter (more accurate on irregular meshes)
    # - fmm: Fast Marching Method (fastest, slightly less accurate)
    wavefront_update_method: "fmm"
    planners: ['epsilon_planner']
    gakd_planner:
      type: 'gakd_mesh_planner/GAKDMeshPlanner'
      
      # Dynamics model selection
      use_simplified_dynamics: false  # If true, uses simple 2D dynamics; if false, uses terrain-aware dynamics with GP corrections
      
      # Wavefront parameters
      cost_limit: 0.5
      goal_dist_offset: 0.3
      wavefront_update_method: "with_s"
      
      # Visualization parameters
      publish_vector_field: true      # Enable to visualize the vector field
      publish_face_vectors: true      # Enable to visualize vectors on individual faces
      
      # Terrain dynamics parameters (only used if use_simplified_dynamics: false)
      mesh_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/mesh_export.obj'
      model_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/gp_matrices.npz'
      curvature_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/curvatures.npz'
      dynamics_dt: 0.1                # Time step for dynamics simulation
      dynamics_epsilon: 0.5           # Epsilon for numerical gradient computation
      neighborhood_radius: 0.24       # Radius for terrain descriptor neighborhood queries
      
      # Control constraints
      min_velocity: -1.5              # Minimum linear velocity (m/s)
      max_velocity: 1.5               # Maximum linear velocity (m/s)
      min_omega: -2.51832             # Minimum angular velocity (rad/s)
      max_omega: 2.5832               # Maximum angular velocity (rad/s)
      
      # Genetic Algorithm parameters
      population_size: 100            # Number of individuals in GA population
      num_generations: 30             # Number of GA generations
      time_horizon: 10                # Planning horizon (number of time steps)
      mutation_rate: 0.01             # Probability of mutation
      tournament_size: 3              # Number of individuals in tournament selection
      mutation_stddev: 0.1            # Standard deviation for Gaussian mutation noise
      
      # Execution parameters
      control_dt: 0.1                 # Time step for control execution
      max_steps: 1000                 # Maximum execution steps before giving up
      goal_threshold: 0.5             # Distance threshold to consider goal reached (m)
      
      # Mesh projection parameters
      position_projection_radius: 0.4  # Radius for projecting positions onto mesh (m)
 
    mppi_planner:
      type: 'mppi_mesh_planner/MPPIMeshPlanner'
      
      # Wavefront parameters
      cost_limit: 0.5
      goal_dist_offset: 0.3
      wavefront_update_method: "with_s"
      
      # Visualization parameters
      publish_vector_field: true
      publish_face_vectors: true
      
      # Dynamics model selection
      use_simplified_dynamics: false
      
      # Terrain dynamics parameters (only used if use_simplified_dynamics: false)
      mesh_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/mesh_export.obj'
      gp_params_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/gp_matrices.npz'
      curvature_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/curvatures.npz'
      dynamics_dt: 0.1
      dynamics_epsilon: 0.5
      
      # MPPI Algorithm parameters
      num_samples: 1000               # Number of trajectory samples per iteration
      num_iterations: 5               # Number of MPPI iterations per control step
      time_horizon: 10                # Planning horizon (number of time steps)
      lambda: 1.0                     # Temperature parameter (lower = more focused on best samples)
      noise_stddev_v: 0.5             # Standard deviation of noise for linear velocity
      noise_stddev_w: 0.3             # Standard deviation of noise for angular velocity
      
      # Control constraints
      min_velocity: -1.5              # Minimum linear velocity (m/s)
      max_velocity: 1.5               # Maximum linear velocity (m/s)
      min_omega: -1.21832             # Minimum angular velocity (rad/s)
      max_omega: 1.2832               # Maximum angular velocity (rad/s)
      
      # Cost weights
      weight_direction: 0.5           # Weight for direction alignment cost
      weight_smoothness: 0.5          # Weight for control smoothness cost
      weight_terminal: 10.0           # Weight for terminal (goal distance) cost
      
      # Execution parameters
      control_dt: 0.1                 # Time step for control execution (seconds)
      max_steps: 1000                 # Maximum execution steps before timeout
      goal_threshold: 0.5             # Distance to goal for success (meters)
      position_projection_radius: 0.4 # Radius for projecting positions onto mesh (meters)

    epsilon_planner:
      type: 'epsilon_mesh_planner/EpsilonMeshPlanner'
      
      # Wavefront parameters
      cost_limit: 0.5
      goal_dist_offset: 0.3
      wavefront_update_method: "with_s"
      
      # Visualization
      publish_vector_field: true
      publish_face_vectors: true
      
      # Dynamics
      use_simplified_dynamics: false
      descriptors_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/vertex_descriptors.npy'
      mesh_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/mesh_export.obj'
      gp_params_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/gp_matrices.npz'
      curvature_file: '/home/otto/workspaces/RL_ws/src/uneven_terrain/mesh_navigation/epsilon_mesh_planner/data/curvatures.npz'
      dynamics_dt: 0.1
      dynamics_epsilon: 0.5
      
      # Epsilon-Constraint Parameters
      num_candidates: 100
      epsilon_base: 0.5                # Base stability budget (will be adapted based on terrain)
      alpha_safe: 0.523599             # 30° max deviation from terrain-normal (hard constraint)
      
      # Adaptive Epsilon Parameters
      roughness_adaptation_strength: 0.5  # How much roughness reduces epsilon (0.0 = no effect, 1.0 = max effect)
      slope_adaptation_strength: 0.3      # How much slope reduces epsilon (0.0 = no effect, 1.0 = max effect)
      
      # Sampling Strategy
      fmm_bias_strength: 0.7           # 0.0=random, 0.5=balanced, 1.0=pure FMM
      noise_stddev_v: 0.5
      noise_stddev_w: 0.3
      
      # Control constraints
      min_velocity: -1.5
      max_velocity: 1.5
      min_omega: -3.21832
      max_omega: 3.2832
      
      # Stability parameters
      max_roll: 0.349066               # 20° safe angle (no penalty below this)
      kappa: 10.0                      # Penalty coefficient for violations
      s_exp: 2.0                       # Goal proximity scaling exponent
      
      # Execution
      time_horizon: 10
      control_dt: 0.1
      max_steps: 1000
      goal_threshold: 0.5
      position_projection_radius: 0.4
      
    planner_patience: 60.0
    planner_max_retries: 2
    project_path_onto_mesh: false

    # GAKD does simultaneous planning and control
    # controllers: ['mesh_controller']
    # mesh_controller:
    #   type: 'mesh_controller/MeshController'
    #   ang_vel_factor: 7.0
    #   lin_vel_factor: 1.0

    controller_patience: 20.0
    controller_max_retries: 4
    dist_tolerance: 0.2
    angle_tolerance: 0.8
    cmd_vel_ignored_tolerance: 10.0

    mesh_map:
      mesh_part: '/'
      mesh_working_part: 'mesh'

      hem: pmp
      # Cost layers: 'height_diff', 'roughness', 'border', 'inflation'
      layers: ['border', 'height_diff', 'inflation']

      height_diff:
        type: 'mesh_layers/HeightDiffLayer'
        factor: 1.0
        threshold: 0.285

      border:
        type: 'mesh_layers/BorderLayer'
        factor: 1.0
        border_cost: 1.0
        threshold: 0.5

      roughness:
        type: 'mesh_layers/RoughnessLayer'
        factor: 1.0
        threshold: 0.8

      inflation:
        type: 'mesh_layers/InflationLayer'
        factor: 1.0
        inflation_radius: 0.7
        inscribed_radius: 0.4
        lethal_value: 1.0
        inscribed_value: 0.8
        repulsive_field: true